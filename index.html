<!DOCTYPE html>
<html lang="en" class="dark"> <!-- Dark mode enabled by default for testing -->

<head>
  <meta charset="UTF-8">
  <title>Paxton Project Configurator</title>

  <!-- Tailwind Dark Mode Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Universal Input/Select Styling (CDN‑Safe, No @apply) -->
  <style>
    /* Light mode defaults */
    select,
    input {
      background-color: white;
      color: #111827;
      border-color: #d1d5db;
    }

    /* Dark mode overrides */
    .dark select,
    .dark input {
      background-color: #374151;
      color: #f3f4f6;
      border-color: #4b5563;
    }
  </style>
</head>

<body id="pageBody"
  class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- ============================================================
       HEADER
       Branding + Dark Mode Toggle
  ============================================================ -->
  <header class="bg-green-600 text-white shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between p-4">

      <!-- Logo + Title -->
      <div class="flex items-center space-x-3">
        <img src="images/paxton-logo.png" class="h-8" alt="Paxton Logo">
        <h1 class="text-xl font-semibold">Paxton Project Configurator</h1>
      </div>

      <!-- Dark Mode Toggle -->
      <button id="themeToggle"
        onclick="toggleDarkMode()"
        class="bg-white/20 hover:bg-white/30 px-3 py-2 rounded-lg">
        ☀️
      </button>

    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT WRAPPER
  ============================================================ -->
  <main class="max-w-4xl mx-auto p-8">

    <!-- Main Card Container -->
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">

      <!-- ============================================================
           PROJECT DETAILS SECTION
      ============================================================ -->
      <div class="mt-6">
        <label class="block font-semibold mb-1">Project Name</label>
        <input id="projectName" class="w-full border rounded-lg p-2 mb-3">

        <label class="block font-semibold mb-1">Customer Name</label>
        <input id="customerName" class="w-full border rounded-lg p-2 mb-3">

        <label class="block font-semibold mb-1">Project State</label>
        <input id="projectState" class="w-full border rounded-lg p-2 mb-3" placeholder="NC, SC, TN etc">
      </div>

      <!-- ============================================================
           PROJECT QUESTIONS
      ============================================================ -->
      <div class="mb-6">
        <label class="block font-semibold mb-2">Number of Doors (1–1000)</label>
        <input id="doorCount" type="number" min="1" max="1000"
          class="w-full border rounded-lg p-2">
      </div>

      <div class="mb-6">
        <label class="block font-semibold mb-2">Multi-Site?</label>
        <select id="multiSite" class="w-full border rounded-lg p-2">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block font-semibold mb-2">Cloud Management Required?</label>
        <select id="cloud" class="w-full border rounded-lg p-2">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block font-semibold mb-2">Future Expansion Expected?</label>
        <select id="expansion" class="w-full border rounded-lg p-2">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block font-semibold mb-2">Video Integration Required?</label>
        <select id="video" class="w-full border rounded-lg p-2">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>

      <!-- Recommend Platform Button -->
      <button onclick="determinePlatform()"
        class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700">
        Recommend Platform
      </button>

      <!-- ============================================================
           RESULTS SECTION
      ============================================================ -->
      <div id="recommendation" class="mt-8 text-xl font-bold"></div>

      <!-- Dynamic Build Options + BOM Output -->
      <div id="bomOutput" class="mt-8"></div>

    </div>
  </main>

  <!-- ============================================================
       JS LIBRARIES
  ============================================================ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

  <!-- Your Main Script -->
  <script src="script.js"></script>

</body>
</html>
